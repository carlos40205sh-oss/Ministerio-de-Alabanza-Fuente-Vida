<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#221F3B"/>
      <stop offset="100%" stop-color="#0F0E1A"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8C96A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E8C96A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E08A"/>
      <stop offset="100%" stop-color="#C8A832"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B6FD4"/>
      <stop offset="100%" stop-color="#E8C96A"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bg)"/>

  <!-- Glow effect center -->
  <circle cx="256" cy="240" r="200" fill="url(#glow)"/>

  <!-- Outer decorative ring -->
  <circle cx="256" cy="240" r="185" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="12 6" opacity="0.6"/>

  <!-- Inner ring -->
  <circle cx="256" cy="240" r="165" fill="none" stroke="#E8C96A" stroke-width="1" opacity="0.2"/>

  <!-- Music note group -->
  <g filter="url(#shadow)">
    <!-- Main note beam (horizontal bar) -->
    <rect x="195" y="128" width="140" height="18" rx="9" fill="url(#noteGrad)"/>

    <!-- Left stem -->
    <rect x="195" y="128" width="18" height="110" rx="9" fill="url(#noteGrad)"/>
    <!-- Left note head -->
    <ellipse cx="196" cy="255" rx="32" ry="22" transform="rotate(-15 196 255)" fill="url(#noteGrad)"/>

    <!-- Right stem -->
    <rect x="317" y="128" width="18" height="90" rx="9" fill="url(#noteGrad)"/>
    <!-- Right note head -->
    <ellipse cx="318" cy="232" rx="32" ry="22" transform="rotate(-15 318 232)" fill="url(#noteGrad)"/>
  </g>

  <!-- Sparkles -->
  <g fill="#E8C96A" opacity="0.9">
    <!-- Top left sparkle -->
    <path d="M120 130 L126 150 L146 156 L126 162 L120 182 L114 162 L94 156 L114 150 Z"/>
    <!-- Top right sparkle -->
    <path d="M390 100 L394 114 L408 118 L394 122 L390 136 L386 122 L372 118 L386 114 Z"/>
    <!-- Bottom right sparkle -->
    <path d="M400 330 L403 340 L413 343 L403 346 L400 356 L397 346 L387 343 L397 340 Z"/>
    <!-- Bottom left sparkle -->
    <path d="M100 320 L104 334 L118 338 L104 342 L100 356 L96 342 L82 338 L96 334 Z"/>
  </g>

  <!-- Small dots accent -->
  <circle cx="160" cy="200" r="5" fill="#7B6FD4" opacity="0.7"/>
  <circle cx="352" cy="300" r="5" fill="#7B6FD4" opacity="0.7"/>
  <circle cx="370" cy="180" r="4" fill="#E8C96A" opacity="0.5"/>
  <circle cx="145" cy="290" r="4" fill="#E8C96A" opacity="0.5"/>

  <!-- Bottom text -->
  <text x="256" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#E8C96A" letter-spacing="2">MINISTERIO</text>
  <text x="256" y="460" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#9590B0" letter-spacing="3">ALABANZA</text>

  <!-- Bottom accent line -->
  <rect x="156" y="472" width="200" height="2" rx="1" fill="url(#ringGrad)" opacity="0.6"/>
</svg>
